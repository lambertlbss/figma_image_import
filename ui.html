<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --ink: #171918;
      --muted: #70756f;
      --paper: #f4f4f0;
      --panel: #ffffff;
      --line: #d9dbd5;
      --line-strong: #bfc3bb;
      --blue: #1668e3;
      --blue-dark: #0e4ca8;
      --green: #198754;
      --orange: #b85c00;
      --red: #c33b2f;
      --purple: #7252b8;
      --shadow: 0 8px 24px rgba(24, 31, 25, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 25, 24, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 25, 24, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 16px 16px;
      font-family: Aptos, "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: 12px;
    }

    button, input, select { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .app {
      position: relative;
      height: 720px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .masthead {
      position: relative;
      padding: 18px 18px 16px;
      color: #f9faf7;
      background: #1b211d;
      overflow: hidden;
    }

    .masthead::after {
      content: "SYNC";
      position: absolute;
      right: -8px;
      top: -18px;
      color: rgba(255, 255, 255, 0.045);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -5px;
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      color: #aeb8b0;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 9px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #78e09e;
      box-shadow: 0 0 0 4px rgba(120, 224, 158, 0.12);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      color: #b8c0ba;
      font-size: 11px;
    }

    .workspace {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
    }

    .pick-button {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      color: #fff;
      background: var(--blue);
      border: 1px solid var(--blue-dark);
      border-radius: 7px;
      box-shadow: 0 4px 0 var(--blue-dark);
      font-weight: 650;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .pick-button:not(:disabled):active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--blue-dark);
    }

    .pick-button .hint {
      font-family: Consolas, monospace;
      font-size: 10px;
      font-weight: 400;
      opacity: 0.72;
    }

    .status-line {
      min-height: 18px;
      margin: 10px 2px 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .status-line.error { color: var(--red); }
    .status-line.success { color: var(--green); }

    .scan-progress {
      display: none;
      margin-top: 10px;
    }

    progress {
      width: 100%;
      height: 6px;
      display: block;
      overflow: hidden;
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: #dde0da;
    }

    progress::-webkit-progress-bar { background: #dde0da; }
    progress::-webkit-progress-value { background: var(--blue); }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
    }

    .plan {
      display: none;
      margin-top: 13px;
      animation: rise 180ms ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .root-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: var(--shadow);
    }

    .folder-mark {
      width: 30px;
      height: 25px;
      position: relative;
      flex: 0 0 auto;
      border: 2px solid #202622;
      border-radius: 4px;
      background: #e8d56d;
    }

    .folder-mark::before {
      content: "";
      position: absolute;
      left: -2px;
      top: -7px;
      width: 13px;
      height: 7px;
      border: 2px solid #202622;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
      background: #e8d56d;
    }

    .root-copy { min-width: 0; flex: 1; }

    .root-label {
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .root-name {
      overflow: hidden;
      margin-top: 2px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .adopted {
      color: var(--purple);
      font-family: Consolas, monospace;
      font-size: 9px;
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 9px;
    }

    .metric {
      min-width: 0;
      padding: 8px 4px 7px;
      color: inherit;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      border-radius: 6px;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    .metric:not(:disabled):hover {
      background: #fff;
      border-color: #979e96;
      transform: translateY(-1px);
    }

    .metric:focus-visible {
      outline: 2px solid rgba(22, 104, 227, 0.35);
      outline-offset: 2px;
    }

    .metric strong {
      display: block;
      font-family: Bahnschrift, sans-serif;
      font-size: 17px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
    }

    .metric.add strong { color: var(--green); }
    .metric.update strong { color: var(--orange); }
    .metric.delete strong { color: var(--red); }
    .metric.move strong { color: var(--purple); }

    .classification-card {
      margin-top: 9px;
      padding: 10px;
      background: #f7f5ff;
      border: 1px solid #cfc4ec;
      border-radius: 7px;
    }

    .classification-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .classification-title {
      font-weight: 700;
    }

    .classification-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .classification-card select {
      min-width: 126px;
      padding: 5px 7px;
      color: #2e2446;
      background: #fff;
      border: 1px solid #b9abd8;
      border-radius: 5px;
      font-size: 10px;
    }

    .refresh-plan-button {
      min-height: 26px;
      padding: 4px 7px;
      color: #4d327d;
      background: #fff;
      border: 1px solid #b9abd8;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 650;
      white-space: nowrap;
    }

    .refresh-plan-button:not(:disabled):hover { background: #f0ebff; }

    .classification-summary {
      margin-top: 6px;
      color: #665b78;
      font-size: 9px;
      line-height: 1.4;
    }

    .ai-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .ai-action-button {
      min-height: 30px;
      padding: 5px 7px;
      color: #4d327d;
      background: #fff;
      border: 1px solid #b9abd8;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 650;
    }

    .ai-action-button:not(:disabled):hover { background: #f0ebff; }

    .ai-status {
      display: none;
      grid-column: 1 / -1;
      color: #665b78;
      font-size: 9px;
      line-height: 1.4;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 13px 2px 6px;
      color: #3d423e;
      font-family: Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .section-heading-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bulk-select-button {
      min-width: 48px;
      padding: 3px 7px;
      color: var(--blue);
      background: #fff;
      border: 1px solid #a9c6ee;
      border-radius: 4px;
      font-family: Aptos, "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .bulk-select-button:not(:disabled):hover { background: #edf5ff; }

    .folder-list {
      max-height: 206px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      box-shadow: var(--shadow);
    }

    .folder-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 6px 9px;
      border-bottom: 1px solid #eceee9;
      cursor: pointer;
      user-select: none;
    }

    .folder-row:last-child { border-bottom: 0; }
    .folder-row:hover { background: #f7f8f4; }

    .folder-row input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--blue);
    }

    .folder-info { min-width: 0; }

    .folder-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .folder-path {
      overflow: hidden;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      flex: 0 0 auto;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: Consolas, monospace;
      font-size: 8px;
      font-weight: 700;
    }

    .badge.existing { color: #145aa8; background: #e4f0ff; }
    .badge.new { color: #166a42; background: #dff5e9; }
    .badge.removed { color: #9f2d24; background: #fee7e4; }

    .folder-counts {
      margin-top: 3px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
    }

    .folder-total {
      color: #595f5a;
      font-family: Consolas, monospace;
      font-size: 9px;
    }

    .delete-option {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin-top: 9px;
      padding: 9px 10px;
      color: #71312b;
      background: #fff3f1;
      border: 1px solid #e8bdb7;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-option input {
      margin: 1px 0 0;
      accent-color: var(--red);
    }

    .delete-option strong { display: block; font-size: 10px; }
    .delete-option small { display: block; margin-top: 2px; color: #94645f; line-height: 1.35; }

    .conflict-note {
      display: none;
      margin-top: 8px;
      padding: 8px 9px;
      color: #6a4c16;
      background: #fff7df;
      border: 1px solid #e5cf8f;
      border-radius: 6px;
      line-height: 1.4;
    }

    .footer {
      padding: 11px 14px 14px;
      background: rgba(244, 244, 240, 0.96);
      border-top: 1px solid var(--line);
    }

    .sync-button {
      width: 100%;
      min-height: 42px;
      color: #fff;
      background: #1d2821;
      border: 1px solid #0c100d;
      border-radius: 7px;
      box-shadow: 0 4px 0 #0c100d;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .sync-button:not(:disabled):active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0c100d;
    }

    .footer-note {
      min-height: 14px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
      text-align: center;
    }

    .preview-view {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 25, 24, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 25, 24, 0.025) 1px, transparent 1px),
        #f7f7f3;
      background-size: 16px 16px;
    }

    .preview-view.visible {
      display: flex;
      animation: preview-in 160ms ease-out both;
    }

    @keyframes preview-in {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .preview-header {
      flex: 0 0 auto;
      padding: 13px 14px 11px;
      color: #f9faf7;
      background: #1b211d;
      border-bottom: 1px solid #0c100d;
    }

    .preview-title-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .preview-back {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      color: #d9e1db;
      background: #2a332d;
      border: 1px solid #465048;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1;
    }

    .preview-back:not(:disabled):hover { background: #364139; }

    .preview-heading {
      min-width: 0;
      flex: 1;
    }

    .preview-heading h2 {
      margin: 0;
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 17px;
      letter-spacing: -0.25px;
    }

    .preview-heading p {
      overflow: hidden;
      margin: 3px 0 0;
      color: #aeb8b0;
      font-family: Consolas, monospace;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-toolbar {
      flex: 0 0 auto;
      padding: 10px 14px 9px;
      background: rgba(247, 247, 243, 0.98);
      border-bottom: 1px solid var(--line);
    }

    .preview-tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: none;
    }

    .preview-tabs::-webkit-scrollbar { display: none; }

    .preview-tab {
      min-height: 28px;
      flex: 0 0 auto;
      padding: 4px 9px;
      color: #59605a;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 9px;
      font-weight: 650;
      white-space: nowrap;
    }

    .preview-tab.active {
      color: #fff;
      background: #1d2821;
      border-color: #1d2821;
    }

    .preview-tab .tab-count {
      margin-left: 3px;
      font-family: Consolas, monospace;
      font-weight: 400;
      opacity: 0.72;
    }

    .preview-filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 128px;
      gap: 6px;
      margin-top: 7px;
    }

    .preview-search,
    .preview-folder-filter {
      min-width: 0;
      height: 32px;
      color: #282d29;
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      font-size: 10px;
    }

    .preview-search {
      padding: 0 9px;
    }

    .preview-folder-filter {
      padding: 0 6px;
    }

    .preview-search:focus,
    .preview-folder-filter:focus {
      border-color: var(--blue);
      outline: 2px solid rgba(22, 104, 227, 0.12);
    }

    .preview-list-wrap {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 14px;
    }

    .preview-list-meta {
      display: flex;
      justify-content: space-between;
      margin: 0 2px 7px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
    }

    .preview-list {
      display: grid;
      gap: 6px;
    }

    .change-row {
      min-width: 0;
      padding: 9px 10px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-left-width: 3px;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(24, 31, 25, 0.045);
    }

    .change-row.add { border-left-color: var(--green); }
    .change-row.update { border-left-color: var(--orange); }
    .change-row.delete { border-left-color: var(--red); }
    .change-row.move { border-left-color: var(--purple); }
    .change-row.unchanged { border-left-color: #9ca29c; }
    .change-row.conflict { border-left-color: #a7771d; background: #fffaf0; }

    .change-row-top {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .change-kind {
      flex: 0 0 auto;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: Consolas, monospace;
      font-size: 8px;
      font-weight: 700;
    }

    .change-kind.add { color: #166a42; background: #dff5e9; }
    .change-kind.update { color: #8c4800; background: #fff0da; }
    .change-kind.delete { color: #9f2d24; background: #fee7e4; }
    .change-kind.move { color: #56368f; background: #eee7fb; }
    .change-kind.unchanged { color: #5f655f; background: #ecefea; }
    .change-kind.conflict { color: #7c5817; background: #f9e9b8; }

    .change-name {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .change-path {
      overflow-wrap: anywhere;
      margin-top: 5px;
      color: #3f4641;
      font-family: Consolas, monospace;
      font-size: 9px;
      line-height: 1.45;
    }

    .change-detail {
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
    }

    .anomaly-row {
      min-width: 0;
      padding: 10px;
      background: #fffdf7;
      border: 1px solid #dfd4b8;
      border-left: 3px solid #c58a18;
      border-radius: 7px;
      box-shadow: 0 3px 10px rgba(60, 42, 12, 0.055);
    }

    .anomaly-row.high {
      background: #fff8f5;
      border-color: #e6c5bb;
      border-left-color: #c94b34;
    }

    .anomaly-top {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
    }

    .anomaly-level {
      padding: 2px 5px;
      color: #7c5817;
      background: #f9e9b8;
      border-radius: 3px;
      font-family: Consolas, monospace;
      font-size: 8px;
      font-weight: 700;
    }

    .anomaly-row.high .anomaly-level {
      color: #922f20;
      background: #fee2dc;
    }

    .anomaly-name {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .anomaly-size {
      color: #8a4d06;
      font-family: Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .anomaly-row.high .anomaly-size { color: #a73523; }

    .anomaly-path {
      overflow-wrap: anywhere;
      margin-top: 6px;
      color: #4c4a41;
      font-family: Consolas, monospace;
      font-size: 9px;
      line-height: 1.4;
    }

    .anomaly-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
    }

    .anomaly-metric {
      padding: 3px 5px;
      color: #65583f;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid #e1d7c0;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 8px;
    }

    .anomaly-reasons {
      margin-top: 6px;
      color: #78623d;
      font-size: 9px;
      line-height: 1.45;
    }

    .anomaly-row.high .anomaly-reasons { color: #8f483b; }

    .component-set-card {
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: 0 3px 10px rgba(24, 31, 25, 0.045);
    }

    .component-set-card summary {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      min-height: 52px;
      padding: 8px 10px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .component-set-card summary::-webkit-details-marker { display: none; }
    .component-set-card summary:hover { background: #f7f8f4; }

    .component-set-chevron {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      color: #5c645e;
      background: #edf0eb;
      border-radius: 4px;
      font-size: 10px;
      transition: transform 140ms ease, background 140ms ease;
    }

    .component-set-card[open] .component-set-chevron {
      color: #fff;
      background: #1d2821;
      transform: rotate(90deg);
    }

    .component-set-heading {

</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="eyebrow"><span class="pulse"></span>Image Library Operator</div>
      <h1>资源增量同步</h1>
      <div class="subtitle">自动识别新增、更新、删除与未变化内容</div>
    </header>

    <main class="workspace">
      <input id="folderInput" type="file" webkitdirectory multiple accept=".png,image/png" hidden />
      <button id="pickButton" class="pick-button" type="button">
        <span>选择资源根目录</span>
        <span class="hint">PNG / FOLDER</span>
      </button>
      <div id="statusLine" class="status-line">选择文件夹后会先扫描差异，不会立即修改画布。</div>

      <div id="scanProgress" class="scan-progress">
        <progress id="progressBar" value="0" max="100"></progress>
        <div class="progress-meta">
          <span id="progressLabel">准备扫描</span>
          <span id="progressPercent">0%</span>
        </div>
      </div>

      <section id="plan" class="plan">
        <div class="root-card">
          <span class="folder-mark" aria-hidden="true"></span>
          <div class="root-copy">
            <div class="root-label">Selected root</div>
            <div id="rootName" class="root-name"></div>
          </div>
          <div id="adoptedCount" class="adopted"></div>
        </div>

        <div class="summary">
          <button class="metric add" type="button" data-preview-type="add"><strong id="countAdd">0</strong><span>新增</span></button>
          <button class="metric update" type="button" data-preview-type="update"><strong id="countUpdate">0</strong><span>更新</span></button>
          <button class="metric delete" type="button" data-preview-type="delete"><strong id="countDelete">0</strong><span>删除</span></button>
          <button class="metric move" type="button" data-preview-type="move"><strong id="countMove">0</strong><span>移动</span></button>
          <button class="metric" type="button" data-preview-type="unchanged"><strong id="countUnchanged">0</strong><span>未变化</span></button>
        </div>

        <div class="classification-card">
          <div class="classification-topline">
            <span class="classification-title">组件集分类</span>
            <div class="classification-controls">
              <button id="refreshPlan" class="refresh-plan-button" type="button" disabled>刷新页面</button>
              <select id="classificationMode" aria-label="组件集分类方式">
                <option value="strict" selected>严格尺寸</option>
                <option value="ai">AI 辅助（基于严格尺寸）</option>
              </select>
            </div>
          </div>
          <div id="classificationSummary" class="classification-summary">扫描后显示分类结果。</div>
          <div id="aiActions" class="ai-actions">
            <button id="publishAiRequest" class="ai-action-button" type="button">生成 MCP 请求</button>
            <button id="loadAiPlan" class="ai-action-button" type="button">读取 AI 方案</button>
            <div id="aiStatus" class="ai-status"></div>
          </div>
        </div>

        <div class="section-heading">
          <span>Folder classification</span>
          <div class="section-heading-actions">
            <span id="selectedFolderCount">0 selected</span>
            <button id="toggleAllFolders" class="bulk-select-button" type="button" disabled>全选</button>
          </div>
        </div>
        <div id="folderList" class="folder-list"></div>

        <label id="deleteOption" class="delete-option">
          <input id="deleteMissing" type="checkbox" checked />
          <span>
            <strong>同步本地删除操作</strong>
            <small>只删除由本插件管理、且本地已经不存在的资源。</small>
          </span>
        </label>

        <div id="conflictNote" class="conflict-note"></div>
      </section>
    </main>

    <footer class="footer">
      <button id="syncButton" class="sync-button" type="button" disabled>等待扫描</button>
      <div id="footerNote" class="footer-note">未变化的 Component 不会被重写或移动</div>
    </footer>

    <section id="previewView" class="preview-view" aria-hidden="true">
      <header class="preview-header">
        <div class="preview-title-row">
          <button id="previewBack" class="preview-back" type="button" aria-label="返回同步设置">←</button>
          <div class="preview-heading">
            <h2>变动预览</h2>
            <p id="previewSubtitle">查看本次同步会影响的资源</p>
          </div>
        </div>
      </header>

      <div class="preview-toolbar">
        <div id="previewTabs" class="preview-tabs" aria-label="变动类型">
          <button class="preview-tab active" type="button" data-preview-filter="changes">全部变动<span class="tab-count">0</span></button>
          <button class="preview-tab" type="button" data-preview-filter="componentSets">组件集<span class="tab-count">0</span></button>
          <button class="preview-tab" type="button" data-preview-filter="anomalies">异常资源<span class="tab-count">0</span></button>
          <button class="preview-tab" type="button" data-preview-filter="add">新增<span class="tab-count">0</span></button>
          <button class="preview-tab" type="button" data-preview-filter="update">更新<span class="tab-count">0</span></button>
          <button class="preview-tab" type="button" data-preview-filter="delete">删除<span class="tab-count">0</span></button>
          <button class="preview-tab" type="button" data-preview-filter="move">移动<span class="tab-count">0</span></button>
          <button class="preview-tab" type="button" data-preview-filter="unchanged">未变化<span class="tab-count">0</span></button>
        </div>
        <div class="preview-filters">
          <input id="previewSearch" class="preview-search" type="search" placeholder="搜索资源名或路径" autocomplete="off" />
          <select id="previewFolderFilter" class="preview-folder-filter" aria-label="筛选文件夹">
            <option value="">所有已选文件夹</option>
          </select>
        </div>
      </div>

      <div id="previewListWrap" class="preview-list-wrap">
        <div class="preview-list-meta">
          <span id="previewResultCount">0 项</span>
          <span id="previewRenderCount">显示 0 项</span>
        </div>
        <div id="previewList" class="preview-list"></div>
        <button id="previewLoadMore" class="preview-load-more" type="button" hidden>加载更多</button>
      </div>

      <footer class="preview-footer">
        <button id="previewReturn" class="preview-return" type="button">返回</button>
        <button id="previewSync" class="preview-sync" type="button" disabled>等待扫描</button>
      </footer>
    </section>
  </div>

  <script>
    const folderInput = document.getElementById('folderInput');
    const pickButton = document.getElementById('pickButton');
    const syncButton = document.getElementById('syncButton');
    const statusLine = document.getElementById('statusLine');
    const scanProgress = document.getElementById('scanProgress');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const progressPercent = document.getElementById('progressPercent');
    const planElement = document.getElementById('plan');
    const folderList = document.getElementById('folderList');
    const toggleAllFolders = document.getElementById('toggleAllFolders');
    const deleteOption = document.getElementById('deleteOption');
    const deleteMissing = document.getElementById('deleteMissing');
    const conflictNote = document.getElementById('conflictNote');
    const classificationMode = document.getElementById('classificationMode');
    const refreshPlan = document.getElementById('refreshPlan');
    const classificationSummary = document.getElementById('classificationSummary');
    const aiActions = document.getElementById('aiActions');
    const publishAiRequest = document.getElementById('publishAiRequest');
    const loadAiPlan = document.getElementById('loadAiPlan');
    const aiStatus = document.getElementById('aiStatus');
    const metricButtons = Array.from(document.querySelectorAll('[data-preview-type]'));
    const previewView = document.getElementById('previewView');
    const previewBack = document.getElementById('previewBack');
    const previewReturn = document.getElementById('previewReturn');
    const previewSync = document.getElementById('previewSync');
    const previewSubtitle = document.getElementById('previewSubtitle');
    const previewTabs = document.getElementById('previewTabs');
    const previewSearch = document.getElementById('previewSearch');
    const previewFolderFilter = document.getElementById('previewFolderFilter');
    const previewListWrap = document.getElementById('previewListWrap');
    const previewList = document.getElementById('previewList');
    const previewResultCount = document.getElementById('previewResultCount');
    const previewRenderCount = document.getElementById('previewRenderCount');
    const previewLoadMore = document.getElementById('previewLoadMore');

    const counters = {
      add: document.getElementById('countAdd'),
      update: document.getElementById('countUpdate'),
      delete: document.getElementById('countDelete'),
      move: document.getElementById('countMove'),
      unchanged: document.getElementById('countUnchanged')
    };

    let requestSequence = 0;
    const pendingRequests = new Map();
    let currentPlan = null;
    let currentManifest = [];
    let currentLocalResourceCount = 0;
    let localResourceDiagnostics = [];
    let currentRootName = '';
    let fileByPath = new Map();
    let selectedFolders = new Set();
    let isBusy = false;
    let syncComplete = false;
    let previewFilter = 'changes';
    let previewRenderLimit = 80;
    let previewPreviousFocus = null;
    const PREVIEW_PAGE_SIZE = 80;
    const COMPONENT_MEMBER_PAGE_SIZE = 48;
    const previewObjectUrls = new Set();
    const REQUEST_TIMEOUT_MS = 600000;
    const APPLY_BATCH_TIMEOUT_MS = 180000;
    const APPLY_BATCH_MAX_FILES = 48;
    const APPLY_BATCH_MAX_BYTES = 12 * 1024 * 1024;
    const APPLY_BATCH_SMALL_FILE_BYTES = 128 * 1024;
    const APPLY_BATCH_MEDIUM_FILE_BYTES = 512 * 1024;
    const HEADER_CONCURRENCY = 12;
    const HASH_CONCURRENCY = 6;
    const ANOMALY_READ_CONCURRENCY = 3;
    const ANOMALY_METADATA_BYTES = 256 * 1024;
    const ANOMALY_METADATA_RATIO_BYTES = 64 * 1024;
    const ANOMALY_METADATA_RATIO = 0.3;
    const ANOMALY_OUTLIER_RATIO = 4;
    const ANOMALY_OUTLIER_EXCESS_BYTES = 128 * 1024;
    const ANOMALY_BPP = 8;
    const ANOMALY_BPP_MIN_BYTES = 128 * 1024;
    const ANOMALY_LARGE_FILE_BYTES = 5 * 1024 * 1024;

    window.addEventListener('message', (event) => {
      const message = event.data && event.data.pluginMessage;
      if (!message) return;
      if (message.type === 'sync-progress') {
        showFileStage(message);
        return;
      }
      if (!message.replyTo) return;
      const pending = pendingRequests.get(message.replyTo);
      if (!pending) return;
      pendingRequests.delete(message.replyTo);
      clearTimeout(pending.timer);
      if (message.ok) pending.resolve(message.data);
      else pending.reject(new Error(message.error || '插件处理失败'));
    });

    function request(type, payload, timeoutMs = REQUEST_TIMEOUT_MS) {
      const requestId = `req-${Date.now()}-${++requestSequence}`;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pendingRequests.delete(requestId);
          reject(new Error(`${type} 阶段响应超时（${Math.round(timeoutMs / 60000)} 分钟），请重试。`));
        }, timeoutMs);
        pendingRequests.set(requestId, { resolve, reject, timer });
        // Figma's plugin bridge expects a regular structured-clone message.
        // Transfer lists can leave the first apply-file request unanswered.
        parent.postMessage({ pluginMessage: { type, requestId, payload } }, '*');
      });
    }

    pickButton.addEventListener('click', () => {
      if (isBusy) return;
      folderInput.value = '';
      folderInput.click();
    });

    folderInput.addEventListener('change', () => scanSelectedFolder());
    syncButton.addEventListener('click', () => startSync());
    toggleAllFolders.addEventListener('click', () => toggleFolderSelection());
    deleteMissing.addEventListener('change', () => updateSelectedSummary());
    classificationMode.addEventListener('change', () => changeClassificationMode());
    refreshPlan.addEventListener('click', () => refreshCurrentPageState());
    publishAiRequest.addEventListener('click', () => publishClassificationRequest());
    loadAiPlan.addEventListener('click', () => loadClassificationPlan());
    for (const button of metricButtons) {
      button.addEventListener('click', () => openChangePreview(button.dataset.previewType));
    }
    previewTabs.addEventListener('click', (event) => {
      const button = event.target.closest('[data-preview-filter]');
      if (!button || isBusy) return;
      previewFilter = button.dataset.previewFilter;
      populatePreviewFolderOptions();
      renderChangePreview(true);
    });
    previewSearch.addEventListener('input', () => renderChangePreview(true));
    previewFolderFilter.addEventListener('change', () => renderChangePreview(true));
    previewLoadMore.addEventListener('click', () => {
      previewRenderLimit += PREVIEW_PAGE_SIZE;
      renderChangePreview(false);
    });
    previewBack.addEventListener('click', () => closeChangePreview());
    previewReturn.addEventListener('click', () => closeChangePreview());
    previewSync.addEventListener('click', () => {
      if (previewSync.disabled) return;
      closeChangePreview(false);
      startSync();
    });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && previewView.classList.contains('visible') && !isBusy) {
        closeChangePreview();
      }
    });

    async function scanSelectedFolder() {
      const pngFiles = Array.from(folderInput.files || []).filter((file) =>
        file.name.toLowerCase().endsWith('.png')
      );
      if (pngFiles.length === 0) {
        setStatus('未找到 PNG 文件，请重新选择资源文件夹。', 'error');
        return;
      }

      setBusy(true);
      resetPlan();
      showProgress(true);
      setProgress(0, '读取文件目录');
      fileByPath = new Map();

      try {
        const scanStartedAt = performance.now();
        const firstParts = splitRelativePath(pngFiles[0]);
        const rootName = firstParts.length > 1 ? firstParts[0] : 'resources';
        const draftManifest = new Array(pngFiles.length);
        let invalidCount = 0;
        let inspectedCount = 0;

        await mapWithConcurrency(pngFiles, HEADER_CONCURRENCY, async (file, index) => {
          try {
            const parts = splitRelativePath(file);
            const relativeParts = parts.length > 1 ? parts.slice(1) : [file.name];
            const relativePath = relativeParts.join('/');
            const folderPath = relativeParts.length > 1 ? relativeParts[0] : '_root';
            const header = await file.slice(0, 24).arrayBuffer();
            const dimensions = readPngDimensions(header);
            draftManifest[index] = {
              relativePath,
              folderPath,
              name: file.name.replace(/\.[^.]+$/, ''),
              hash: '',
              width: dimensions.width,
              height: dimensions.height,
              sourceSize: file.size,
              lastModified: file.lastModified
            };
            fileByPath.set(relativePath, file);
          } catch (_) {
            invalidCount++;
          } finally {
            inspectedCount++;
            const percent = Math.round((inspectedCount / pngFiles.length) * 30);
            setProgress(percent, `读取 PNG 信息 ${inspectedCount} / ${pngFiles.length}`);
          }
        });
        const headerFinishedAt = performance.now();

        const validManifest = draftManifest.filter(Boolean);
        const manifest = dedupeNewestResources(validManifest);
        const duplicateNameCount = validManifest.length - manifest.length;
        if (manifest.length === 0) throw new Error('文件夹中没有有效的 PNG 图片。');
        setProgress(31, '检查异常资源体积');
        const anomalyStartedAt = performance.now();
        localResourceDiagnostics = await analyzeLocalResourceAnomalies(
          validManifest,
          fileByPath,
          (completed, total) => {
            const ratio = total > 0 ? completed / total : 1;
            setProgress(31 + Math.round(ratio * 3), `分析疑似异常 PNG ${completed} / ${total}`);
          }
        );
        currentLocalResourceCount = validManifest.length;
        const anomalyFinishedAt = performance.now();
        setProgress(34, '快速比对 Figma 资源索引');
        const preflightStartedAt = performance.now();
        const preflight = await request('prepare-scan', { rootName, manifest });
        const preflightFinishedAt = performance.now();
        const knownHashes = new Map(preflight.knownHashes || []);
        const hashPaths = new Set(preflight.hashPaths || []);
        const entriesToHash = manifest.filter((entry) => hashPaths.has(entry.relativePath));
        let hashedCount = 0;

        for (const entry of manifest) {
          if (knownHashes.has(entry.relativePath)) entry.hash = knownHashes.get(entry.relativePath);
        }

        const hashStartedAt = performance.now();
        await mapWithConcurrency(entriesToHash, HASH_CONCURRENCY, async (entry) => {
          const file = fileByPath.get(entry.relativePath);
          if (!file) throw new Error(`找不到本地文件：${entry.relativePath}`);
          entry.hash = await hashBuffer(await file.arrayBuffer());
          hashedCount++;
          const ratio = entriesToHash.length > 0 ? hashedCount / entriesToHash.length : 1;
          setProgress(38 + Math.round(ratio * 44), `计算变化资源指纹 ${hashedCount} / ${entriesToHash.length}`);
        });
        const hashFinishedAt = performance.now();

        setProgress(88, '生成同步差异');
        const planStartedAt = performance.now();
        currentManifest = manifest;
        currentRootName = rootName;
        const result = await request('prepare-sync', {
          rootName,
          manifest,
          classificationMode: classificationMode.value
        });
        const planFinishedAt = performance.now();
        result.adopted = (result.adopted || 0) + (preflight.adopted || 0);
        result.conflicts = Array.from(new Set([
          ...(preflight.conflicts || []),
          ...(result.conflicts || [])
        ]));
        result.scanTimings = {
          headerMs: headerFinishedAt - scanStartedAt,
          anomalyMs: anomalyFinishedAt - anomalyStartedAt,
          preflightMs: preflightFinishedAt - preflightStartedAt,
          hashMs: hashFinishedAt - hashStartedAt,
          planMs: planFinishedAt - planStartedAt,
          totalMs: planFinishedAt - scanStartedAt,
          scanIndexReused: result.scanIndexReused === true
        };
        setProgress(100, '差异分析完成');
        renderPlan(result);

        const notes = [];
        if (duplicateNameCount > 0) notes.push(`同名覆盖 ${duplicateNameCount} 个旧文件`);
        if (invalidCount > 0) notes.push(`跳过 ${invalidCount} 个无效 PNG`);
        if (localResourceDiagnostics.length > 0) {
          notes.push(`发现 ${localResourceDiagnostics.length} 个异常资源`);
        }
        const suffix = notes.length > 0 ? `，${notes.join('，')}` : '';
        const seconds = ((performance.now() - scanStartedAt) / 1000).toFixed(1);
        setStatus(
          `扫描完成：${manifest.length} 个资源，仅校验 ${entriesToHash.length} 个内容，用时 ${seconds}s${suffix}`,
          invalidCount ? 'error' : 'success'
        );
      } catch (error) {
        setStatus(error.message || String(error), 'error');
        resetPlan();
      } finally {
        setBusy(false);
        setTimeout(() => {
          if (!isBusy) showProgress(false);
        }, 450);
      }
    }

    function renderPlan(plan, options) {
      const previousSelection = selectedFolders;
      currentPlan = plan;
      syncComplete = false;
      const availableFolders = new Set(plan.folders.map((folder) => folder.folderPath));
      selectedFolders = options && options.preserveSelection
        ? new Set(Array.from(previousSelection).filter((folderPath) => availableFolders.has(folderPath)))
        : availableFolders;
      document.getElementById('rootName').textContent = plan.rootName;
      document.getElementById('adoptedCount').textContent = plan.adopted > 0
        ? `接管 ${plan.adopted}`
        : '';

      folderList.replaceChildren();
      for (const folder of plan.folders) {
        folderList.appendChild(createFolderRow(folder));
      }

      if (plan.conflicts && plan.conflicts.length > 0) {
        conflictNote.style.display = 'block';
        conflictNote.textContent = `${plan.conflicts.length} 个旧资源无法唯一匹配，将保持不动。`;
      } else {
        conflictNote.style.display = 'none';
        conflictNote.textContent = '';
      }

      planElement.style.display = 'block';
      refreshPlan.disabled = isBusy;
      renderClassificationSummary(plan.classification || {});
      updateSelectedSummary();
    }

    function openChangePreview(type) {
      if (!currentPlan || isBusy || syncComplete) return;
      previewPreviousFocus = document.activeElement;
      previewFilter = ['add', 'update', 'delete', 'move', 'unchanged'].includes(type)
        ? type
        : 'changes';
      previewSearch.value = '';
      populatePreviewFolderOptions();
      previewFolderFilter.value = '';
      previewView.classList.add('visible');
      previewView.setAttribute('aria-hidden', 'false');
      renderChangePreview(true);
      previewSearch.focus();
    }

    function closeChangePreview(restoreFocus = true) {
      if (!previewView.classList.contains('visible')) return;
      previewView.classList.remove('visible');
      previewView.setAttribute('aria-hidden', 'true');
      releasePreviewObjectUrls();
      previewList.replaceChildren();
      previewLoadMore.hidden = true;
      if (restoreFocus && previewPreviousFocus && typeof previewPreviousFocus.focus === 'function') {
        previewPreviousFocus.focus();
      }
      previewPreviousFocus = null;
    }

    function populatePreviewFolderOptions() {
      const previousValue = previewFolderFilter.value;
      const anomalyMode = previewFilter === 'anomalies';
      previewFolderFilter.replaceChildren(new Option(
        anomalyMode ? '所有本地文件夹' : '所有已选文件夹',
        ''
      ));
      const folders = anomalyMode
        ? Array.from(new Set(localResourceDiagnostics.map((item) => item.folderPath)))
          .sort((a, b) => a.localeCompare(b))
        : (currentPlan
          ? currentPlan.folders
            .map((folder) => folder.folderPath)
            .filter((folderPath) => selectedFolders.has(folderPath))
            .sort((a, b) => a.localeCompare(b))
          : []);
      for (const folderPath of folders) {
        previewFolderFilter.appendChild(new Option(folderPath, folderPath));
      }
      previewFolderFilter.value = folders.includes(previousValue) ? previousValue : '';
    }

    function renderChangePreview(resetLimit) {
      if (!currentPlan || !previewView.classList.contains('visible')) return;
      releasePreviewObjectUrls();
      if (resetLimit) {
        previewRenderLimit = PREVIEW_PAGE_SIZE;
        previewListWrap.scrollTop = 0;
      }

      const selectedActions = currentPlan.actions.filter(
        (action) => selectedFolders.has(action.folderPath)
      );
      const counts = { add: 0, update: 0, delete: 0, move: 0, unchanged: 0, conflict: 0 };
      for (const action of selectedActions) {
        if (Object.prototype.hasOwnProperty.call(counts, action.type)) counts[action.type]++;
      }
      const componentSetGroups = buildChangedComponentSetGroups(selectedActions);
      updatePreviewTabs(counts, componentSetGroups.length, localResourceDiagnostics.length);

      const folderPath = previewFolderFilter.value;
      const query = previewSearch.value.trim().toLocaleLowerCase();
      if (previewFilter === 'anomalies') {
        previewSubtitle.textContent =
          `${currentPlan.rootName} · 已检查 ${currentLocalResourceCount} 个本地资源`;
        const filteredAnomalies = localResourceDiagnostics.filter((item) => {
          if (folderPath && item.folderPath !== folderPath) return false;
          if (!query) return true;
          return [
            item.name,
            item.relativePath,
            item.folderPath,
            ...item.reasons
          ].filter(Boolean).some((value) =>
            String(value).toLocaleLowerCase().includes(query)
          );
        });
        renderAnomalyResources(filteredAnomalies, query, folderPath);
        return;
      }

      previewSubtitle.textContent = `${currentPlan.rootName} · ${selectedFolders.size} 个已选文件夹`;
      if (previewFilter === 'componentSets') {
        const filteredGroups = componentSetGroups.filter((group) => {
          if (folderPath && group.folderPath !== folderPath) return false;
          if (!query) return true;
          return [
            group.name,
            group.folderPath,
            group.variantProperty,
            ...group.members.flatMap((member) => [member.name, member.relativePath])
          ].filter(Boolean).some((value) => String(value).toLocaleLowerCase().includes(query));
        });
        renderComponentSetGroups(filteredGroups, query, folderPath);
        return;
      }

      const filtered = selectedActions.filter((action) => {
        const typeMatches = previewFilter === 'changes'
          ? action.type !== 'unchanged'
          : action.type === previewFilter;
        if (!typeMatches) return false;
        if (folderPath && action.folderPath !== folderPath) return false;
        if (!query) return true;
        return [
          action.name,
          action.relativePath,
          action.oldRelativePath,
          action.folderPath
        ].filter(Boolean).some((value) => String(value).toLocaleLowerCase().includes(query));
      });

      const visibleActions = filtered.slice(0, previewRenderLimit);
      const fragment = document.createDocumentFragment();
      for (const action of visibleActions) fragment.appendChild(createChangeRow(action));
      previewList.replaceChildren(fragment);

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'preview-empty';
        const title = document.createElement('strong');
        title.textContent = query || folderPath ? '没有符合筛选条件的资源' : '这个分类没有资源';
        const detail = document.createElement('span');
        detail.textContent = query || folderPath
          ? '可以清空搜索或切换文件夹后再查看。'
          : '当前同步计划不会产生此类变动。';
        empty.append(title, detail);
        previewList.appendChild(empty);
      }

      previewResultCount.textContent = `${filtered.length} 项`;
      previewRenderCount.textContent = `显示 ${visibleActions.length} 项`;
      previewLoadMore.hidden = visibleActions.length >= filtered.length;
      previewLoadMore.textContent = `继续加载 ${Math.min(PREVIEW_PAGE_SIZE, filtered.length - visibleActions.length)} 项`;
    }

    function updatePreviewTabs(counts, componentSetCount, anomalyCount) {
      const changeCount = counts.add + counts.update + counts.delete + counts.move + counts.conflict;
      for (const tab of previewTabs.querySelectorAll('[data-preview-filter]')) {
        const type = tab.dataset.previewFilter;
        const count = type === 'changes'
          ? changeCount
          : (type === 'componentSets'
            ? componentSetCount
            : (type === 'anomalies' ? anomalyCount : (counts[type] || 0)));
        const countElement = tab.querySelector('.tab-count');
        if (countElement) countElement.textContent = count;
        tab.classList.toggle('active', type === previewFilter);
        tab.setAttribute('aria-pressed', type === previewFilter ? 'true' : 'false');
      }
    }

    function renderAnomalyResources(items, query, folderPath) {
      const visibleItems = items.slice(0, previewRenderLimit);
      const fragment = document.createDocumentFragment();
      for (const item of visibleItems) fragment.appendChild(createAnomalyRow(item));
      previewList.replaceChildren(fragment);

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'preview-empty';
        const title = document.createElement('strong');
        title.textContent = query || folderPath
          ? '没有符合筛选条件的异常资源'
          : '没有发现明显异常资源';
        const detail = document.createElement('span');
        detail.textContent = query || folderPath
          ? '可以清空搜索或切换本地文件夹后再查看。'
          : `已检查 ${currentLocalResourceCount} 个本地 PNG，未发现明显的元数据或体积异常。`;
        empty.append(title, detail);
        previewList.appendChild(empty);
      }

      const totalBytes = items.reduce((sum, item) => sum + item.sourceSize, 0);
      const metadataBytes = items.reduce((sum, item) => sum + item.metadataBytes, 0);
      previewResultCount.textContent = `${items.length} 个异常资源`;
      previewRenderCount.textContent = items.length > 0
        ? `合计 ${formatFileSize(totalBytes)} · 元数据 ${formatFileSize(metadataBytes)}`
        : '显示 0 项';
      previewLoadMore.hidden = visibleItems.length >= items.length;
      previewLoadMore.textContent =
        `继续加载 ${Math.min(PREVIEW_PAGE_SIZE, items.length - visibleItems.length)} 项`;
    }

    function createAnomalyRow(item) {
      const row = document.createElement('article');
      row.className = `anomaly-row ${item.severity === 'high' ? 'high' : 'review'}`;

      const top = document.createElement('div');
      top.className = 'anomaly-top';
      const level = document.createElement('span');
      level.className = 'anomaly-level';
      level.textContent = item.severity === 'high' ? '高风险' : '需检查';
      const name = document.createElement('div');
      name.className = 'anomaly-name';
      name.textContent = item.name || basenameFromPath(item.relativePath);
      const size = document.createElement('span');
      size.className = 'anomaly-size';
      size.textContent = formatFileSize(item.sourceSize);
      top.append(level, name, size);

      const path = document.createElement('div');
      path.className = 'anomaly-path';
      path.textContent = item.relativePath;

      const metrics = document.createElement('div');
      metrics.className = 'anomaly-metrics';
      const metricLabels = [
        formatDimensions(item.width, item.height),
        `单位像素 ${formatRatio(item.bytesPerPixel)} B`,
        item.medianSize > 0 ? `同尺寸中位数 ${formatFileSize(item.medianSize)}` : '',
        item.metadataBytes > 0
          ? `元数据 ${formatFileSize(item.metadataBytes)} / ${Math.round(item.metadataRatio * 100)}%`
          : ''
      ].filter(Boolean);
      for (const label of metricLabels) {
        const metric = document.createElement('span');
        metric.className = 'anomaly-metric';
        metric.textContent = label;
        metrics.appendChild(metric);
      }

      const reasons = document.createElement('div');
      reasons.className = 'anomaly-reasons';
      const chunkSummary = item.metadataChunks
        .slice(0, 3)
        .map((chunk) => `${chunk.type} ${formatFileSize(chunk.bytes)}`)
        .join(' · ');
      reasons.textContent = [
        item.reasons.join('；'),
        chunkSummary ? `区块：${chunkSummary}` : ''
      ].filter(Boolean).join(' · ');
      row.append(top, path, metrics, reasons);
      return row;
    }

    function buildChangedComponentSetGroups(actions) {
      const groups = new Map();
      const affectedTypes = new Set(['add', 'update', 'delete', 'move']);
      const previousSetActions = actions.filter((action) =>
        affectedTypes.has(action.type) && action.previousComponentSetId
      );

      for (const action of actions) {
        if (!action.componentSetKey || action.type === 'delete' || action.type === 'conflict') continue;
        const id = `${action.folderPath}\u0000${action.componentSetKey}`;
        if (!groups.has(id)) {
          groups.set(id, {
            id,
            folderPath: action.folderPath,
            key: action.componentSetKey,
            name: action.componentSetName || action.componentSetKey,
            variantProperty: action.variantProperty || 'Property 1',
            members: [],
            directActions: new Set(),
            stablePreviousSetIds: new Set(),
            allPreviousSetIds: new Set()
          });
        }
        const group = groups.get(id);
        group.members.push({
          relativePath: action.relativePath,
          name: action.name,
          width: action.width,
          height: action.height,
          changeType: action.type
        });
        if (affectedTypes.has(action.type)) group.directActions.add(action);
        if (action.previousComponentSetId) {
          group.allPreviousSetIds.add(action.previousComponentSetId);
          if (action.type === 'unchanged') {
            group.stablePreviousSetIds.add(action.previousComponentSetId);
          }
        }
      }

      const result = [];
      for (const group of groups.values()) {
        const previousSetIds = group.stablePreviousSetIds.size > 0
          ? group.stablePreviousSetIds
          : group.allPreviousSetIds;
        const affectedActions = new Set(group.directActions);
        for (const action of previousSetActions) {
          if (previousSetIds.has(action.previousComponentSetId)) affectedActions.add(action);
        }
        if (affectedActions.size === 0) continue;

        const changeCounts = { add: 0, update: 0, delete: 0, move: 0 };
        for (const action of affectedActions) {
          if (Object.prototype.hasOwnProperty.call(changeCounts, action.type)) {
            changeCounts[action.type]++;
          }
        }
        group.members.sort((a, b) => a.relativePath.localeCompare(b.relativePath));
        result.push({
          id: group.id,
          folderPath: group.folderPath,
          key: group.key,
          name: group.name,
          variantProperty: group.variantProperty,
          members: group.members,
          changeCounts,
          changedCount: affectedActions.size
        });
      }
      return result.sort((a, b) =>
        a.folderPath.localeCompare(b.folderPath) || a.name.localeCompare(b.name)
      );
    }

    function renderComponentSetGroups(groups, query, folderPath) {
      const fragment = document.createDocumentFragment();
      for (const group of groups) fragment.appendChild(createComponentSetCard(group));
      previewList.replaceChildren(fragment);

      if (groups.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'preview-empty';
        const title = document.createElement('strong');
        title.textContent = query || folderPath ? '没有符合筛选条件的组件集' : '没有发生变化的组件集';
        const detail = document.createElement('span');
        detail.textContent = query || folderPath
          ? '可以清空搜索或切换文件夹后再查看。'
          : '本次同步不会改变任何 Component Set。';
        empty.append(title, detail);
        previewList.appendChild(empty);
      }

      previewResultCount.textContent = `${groups.length} 个组件集`;
      previewRenderCount.textContent = groups.length > 0 ? '标题默认收起' : '显示 0 项';
      previewLoadMore.hidden = true;
    }

    function createComponentSetCard(group) {
      const details = document.createElement('details');
      details.className = 'component-set-card';

      const summary = document.createElement('summary');
      const chevron = document.createElement('span');
      chevron.className = 'component-set-chevron';
      chevron.textContent = '›';
      const heading = document.createElement('div');
      heading.className = 'component-set-heading';
      const name = document.createElement('div');
      name.className = 'component-set-name';
      name.textContent = group.name;
      const meta = document.createElement('div');
      meta.className = 'component-set-meta';
      meta.textContent = `${group.folderPath} / ${group.variantProperty}`;
      heading.append(name, meta);
      const count = document.createElement('span');
      count.className = 'component-set-count';
      count.textContent = `${group.members.length} 个`;
      summary.append(chevron, heading, count);
      details.appendChild(summary);

      const objectUrls = [];
      details.addEventListener('toggle', () => {
        const existingBody = details.querySelector('.component-set-body');
        if (!details.open) {
          releaseObjectUrls(objectUrls);
          if (existingBody) existingBody.remove();
          return;
        }
        if (existingBody) return;
        const body = document.createElement('div');
        body.className = 'component-set-body';
        details.appendChild(body);
        renderComponentSetMembers(group, body, objectUrls, COMPONENT_MEMBER_PAGE_SIZE);
      });
      return details;
    }

    function renderComponentSetMembers(group, body, objectUrls, limit) {
      releaseObjectUrls(objectUrls);
      const chips = document.createElement('div');
      chips.className = 'component-set-changes';
      const resultChip = document.createElement('span');
      resultChip.className = 'component-set-change-chip';
      resultChip.textContent = `同步后 ${group.members.length} 个组件`;
      chips.appendChild(resultChip);
      for (const type of ['add', 'update', 'delete', 'move']) {
        const count = group.changeCounts[type] || 0;
        if (!count) continue;
        const chip = document.createElement('span');
        chip.className = 'component-set-change-chip';
        chip.textContent = `${changeTypeLabel(type)} ${count}`;
        chips.appendChild(chip);
      }

      const members = document.createElement('div');
      members.className = 'component-members';
      const visibleMembers = group.members.slice(0, limit);
      for (const member of visibleMembers) {
        members.appendChild(createComponentMember(member, objectUrls));
      }
      body.replaceChildren(chips, members);

      if (visibleMembers.length < group.members.length) {
        const more = document.createElement('button');
        more.className = 'component-members-more';
        more.type = 'button';
        more.textContent = `继续加载 ${Math.min(COMPONENT_MEMBER_PAGE_SIZE, group.members.length - visibleMembers.length)} 个组件`;
        more.addEventListener('click', () => {
          renderComponentSetMembers(
            group,
            body,
            objectUrls,
            Math.min(group.members.length, limit + COMPONENT_MEMBER_PAGE_SIZE)
          );
        });
        body.appendChild(more);
      }
    }

    function createComponentMember(member, objectUrls) {
      const card = document.createElement('div');
      card.className = 'component-member';
      card.title = member.relativePath;
      const thumb = document.createElement('div');
      thumb.className = 'component-thumb';
      const file = fileByPath.get(member.relativePath);
      let previewReady = false;
      if (file && typeof URL.createObjectURL === 'function') {
        try {
          const objectUrl = URL.createObjectURL(file);
          previewObjectUrls.add(objectUrl);
          objectUrls.push(objectUrl);
          const image = document.createElement('img');
          image.src = objectUrl;
          image.alt = member.name || basenameFromPath(member.relativePath);
          image.loading = 'lazy';
          image.decoding = 'async';
          image.addEventListener('error', () => {
            releaseObjectUrl(objectUrl);
            image.replaceWith(createThumbnailPlaceholder('图片读取失败'));
          }, { once: true });
          thumb.appendChild(image);
          previewReady = true;
        } catch (_) {
          previewReady = false;
        }
      }
      if (!previewReady) thumb.appendChild(createThumbnailPlaceholder('无本地预览'));

      const name = document.createElement('div');
      name.className = 'component-member-name';
      name.textContent = member.name || basenameFromPath(member.relativePath);
      const meta = document.createElement('div');
      meta.className = 'component-member-meta';
      meta.textContent = formatDimensions(member.width, member.height) || member.relativePath;
      const change = document.createElement('span');
      const changeType = ['add', 'update', 'move'].includes(member.changeType)
        ? member.changeType
        : 'unchanged';
      change.className = `component-member-change ${changeType}`;
      change.textContent = changeType === 'unchanged' ? '保留' : changeTypeLabel(changeType);
      card.append(thumb, name, meta, change);
      return card;
    }

    function createThumbnailPlaceholder(message) {
      const placeholder = document.createElement('span');
      placeholder.className = 'component-thumb-placeholder';
      placeholder.textContent = message;
      return placeholder;
    }

    function releaseObjectUrl(objectUrl) {
      if (!previewObjectUrls.has(objectUrl)) return;
      URL.revokeObjectURL(objectUrl);
      previewObjectUrls.delete(objectUrl);
    }

    function releaseObjectUrls(objectUrls) {
      for (const objectUrl of objectUrls.splice(0)) releaseObjectUrl(objectUrl);
    }

    function releasePreviewObjectUrls() {
      for (const objectUrl of Array.from(previewObjectUrls)) releaseObjectUrl(objectUrl);
    }

    function createChangeRow(action) {
      const type = ['add', 'update', 'delete', 'move', 'unchanged', 'conflict'].includes(action.type)
        ? action.type
        : 'conflict';
      const row = document.createElement('article');
      row.className = `change-row ${type}`;

      const top = document.createElement('div');
      top.className = 'change-row-top';
      const kind = document.createElement('span');
      kind.className = `change-kind ${type}`;
      kind.textContent = changeTypeLabel(type);
      const name = document.createElement('div');
      name.className = 'change-name';
      name.textContent = action.name || basenameFromPath(action.relativePath);
      top.append(kind, name);

      const path = document.createElement('div');
      path.className = 'change-path';
      path.textContent = type === 'move' && action.oldRelativePath
        ? `${action.oldRelativePath}  →  ${action.relativePath}`
        : action.relativePath;

      const detail = document.createElement('div');
      detail.className = 'change-detail';
      detail.textContent = describeChangeAction(action);
      row.append(top, path, detail);
      return row;
    }

    function changeTypeLabel(type) {
      return {
        add: '新增',
        update: '更新',
        delete: '删除',
        move: '移动',
        unchanged: '未变化',
        conflict: '冲突'
      }[type] || '检查';
    }

    function describeChangeAction(action) {
      const dimensions = formatDimensions(action.width, action.height);
      if (action.type === 'add') return dimensions ? `新建 Component · ${dimensions}` : '新建 Component';
      if (action.type === 'update') {
        const previous = formatDimensions(action.previousWidth, action.previousHeight);
        if (previous && dimensions && previous !== dimensions) {
          return `图片内容与尺寸更新 · ${previous} → ${dimensions}`;
        }
        return dimensions ? `图片内容更新 · ${dimensions}` : '图片内容更新';
      }
      if (action.type === 'delete') {
        if (!action.required && !deleteMissing.checked) return '本地删除同步已关闭，本项将保留';
        return action.reason === 'duplicate-name'
          ? '同名重复 Component，将自动清理'
          : '本地资源已不存在，将删除插件管理的 Component';
      }
      if (action.type === 'move') {
        if (action.layoutOnly) return '仅修复 Section 或 Component Set 排版';
        return action.oldRelativePath
          ? '保留 Component ID，并移动到新的资源路径'
          : '调整 Component Set 或 Section 归属，图片内容不变';
      }
      if (action.type === 'unchanged') return '保持现有 Component，不重写、不移动';
      return '旧资源无法唯一匹配，本次保持不动';
    }

    function formatDimensions(width, height) {
      const w = Number(width);
      const h = Number(height);
      return w > 0 && h > 0 ? `${w}×${h}` : '';
    }

    function basenameFromPath(relativePath) {
      const filename = String(relativePath || '').split('/').pop() || '';
      return filename.replace(/\.[^.]+$/, '');
    }

    function renderClassificationSummary(summary) {
      const modeLabels = {
        strict: '严格尺寸',
        ai: 'AI 辅助（基于严格尺寸）'
      };
      const mode = summary.mode || classificationMode.value;
      classificationMode.value = mode;
      classificationSummary.textContent = [
        modeLabels[mode] || mode,
        `${Number(summary.groups) || 0} 个组件集`,
        `${Number(summary.groupedAssets) || 0} 个已分组`,
        `${Number(summary.standaloneAssets) || 0} 个保持独立`,
        Number(summary.aiGroups) > 0 ? `${summary.aiGroups} 个 AI 组` : ''
      ].filter(Boolean).join(' · ');
      aiActions.style.display = mode === 'ai' ? 'grid' : 'none';
    }

    async function changeClassificationMode() {
      aiActions.style.display = classificationMode.value === 'ai' ? 'grid' : 'none';
      aiStatus.style.display = 'none';
      aiStatus.textContent = '';
      if (!currentPlan || isBusy) return;
      setBusy(true);
      showProgress(true);
      setProgress(20, '重新扫描当前 Figma 页面');
      try {
        const result = await request('set-classification-mode', { mode: classificationMode.value });
        renderPlan(result, { preserveSelection: true });
        setProgress(100, '页面状态已刷新');
        setStatus('已重新扫描当前页面并更新分类方式，画布尚未修改。', 'success');
      } catch (error) {
        setStatus(error.message || String(error), 'error');
      } finally {
        setBusy(false);
        setTimeout(() => showProgress(false), 450);
      }
    }

    async function refreshCurrentPageState() {
      if (!currentPlan || isBusy || currentManifest.length === 0) return;
      setBusy(true);
      showProgress(true);
      setProgress(20, '重新扫描当前 Figma 页面');
      aiStatus.style.display = 'none';
      aiStatus.textContent = '';
      try {
        const result = await request('refresh-sync', { mode: classificationMode.value });
        renderPlan(result, { preserveSelection: true });
        setProgress(100, '页面状态已刷新');
        const summary = result.summary || {};
        setStatus(
          `刷新完成：新增 ${summary.add || 0} · 更新 ${summary.update || 0} · 删除 ${summary.delete || 0} · 移动 ${summary.move || 0} · 未变化 ${summary.unchanged || 0}`,
          'success'
        );
      } catch (error) {
        setStatus(`刷新失败：${error.message || String(error)}`, 'error');
      } finally {
        setBusy(false);
        setTimeout(() => showProgress(false), 450);
      }
    }

    async function publishClassificationRequest() {
      if (!currentPlan || isBusy || classificationMode.value !== 'ai') return;
      setBusy(true);
      try {
        const result = await request('publish-classification-request', {
          selectedFolders: Array.from(selectedFolders)
        });
        const copied = await copyText(result.prompt || '');
        aiStatus.style.display = 'block';
        aiStatus.textContent = copied
          ? `请求 ${result.requestId} 已写入页面，MCP 提示词已复制。粘贴到 Codex 后，回来点击“读取 AI 方案”。`
          : `请求 ${result.requestId} 已写入页面。请在 MCP 客户端读取当前页面的 classification-request。`;
        setStatus(
          `已为 ${result.folderCount} 个文件夹、${result.assetCount} 个资源生成 AI 分类请求，发现 ${result.semanticCandidateCount || 0} 个跨尺寸/语义候选系列。`,
          'success'
        );
      } catch (error) {
        setStatus(error.message || String(error), 'error');
      } finally {
        setBusy(false);
      }
    }

    async function loadClassificationPlan() {
      if (!currentPlan || isBusy || classificationMode.value !== 'ai') return;
      setBusy(true);
      try {
        const result = await request('load-classification-plan', {});
        renderPlan(result, { preserveSelection: true });
        aiStatus.style.display = 'block';
        aiStatus.textContent = `已读取并校验 AI 方案：${result.classification.aiGroups || 0} 个 AI 组件集。确认文件夹和变更数量后再开始同步。`;
        setStatus('AI 分类方案已载入，画布尚未修改。', 'success');
      } catch (error) {

        setBusy(false);
      }
